name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  verify:
    name: Verify (tokens, dataset, analyze, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Design tokens are in sync with the HTML prototype
        run: node tools/extract_tokens.mjs --check

      - name: AppInfo matches pubspec.yaml
        run: node tools/check_version.mjs

      - name: Plan dataset reconciles to the PDF
        run: node tools/validate_plan_data.mjs

      - name: Validator still catches corruption
        run: node tools/validate_plan_data.mjs --self-test

      - name: Analyze
        # Warnings and infos are reported but do not block the build yet; errors do.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  build-debug:
    name: Build debug APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      # A universal debug APK carries three debug engines (~200 MB). The app
      # ships for 64-bit ARM only, so build exactly that; testers get a smaller
      # download that matches the shipped ABI.
      - run: flutter build apk --debug --target-platform android-arm64

      - name: Report and guard debug APK size
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          BYTES=$(stat -c%s "$APK")
          MIB=$((BYTES / 1024 / 1024))
          MAX_BYTES=$((90 * 1024 * 1024))
          {
            echo "### Debug APK (arm64)"
            echo ""
            echo "$MIB MiB ($BYTES bytes), ceiling $((MAX_BYTES / 1024 / 1024)) MiB"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Debug APK: $MIB MiB ($BYTES bytes)"
          if [ "$BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::Debug APK grew past $((MAX_BYTES / 1024 / 1024)) MiB; investigate before downloading it."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khutati-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  build-release:
    name: Build signed release APK
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are missing; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/khutati-release.jks
          # Fail before the long Gradle build if the secret cannot be opened.
          keytool -list \
            -keystore android/app/khutati-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          {
            echo "storeFile=khutati-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties

      - name: Build release APK for modern devices
        # arm64-v8a only: current phones are 64-bit, so one small APK covers the
        # target. `--split-per-abi` is kept so the output layout stays standard.
        # Supabase update config is optional: empty defines fall back to GitHub.
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols
          --dart-define=KHUTATI_SUPABASE_URL=${{ secrets.KHUTATI_SUPABASE_URL }}
          --dart-define=KHUTATI_SUPABASE_ANON_KEY=${{ secrets.KHUTATI_SUPABASE_ANON_KEY }}

      - name: Name the shipped APK
        run: |
          set -euo pipefail
          cp -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/Khutati.apk

      # The APK that ships must be signed by the secret-backed release key, not
      # by the runner's auto-generated debug key. `apksigner` verifies the
      # signature schemes; the fingerprint comparison proves exactly which
      # keystore signed it without printing any secret.
      - name: Verify release signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/Khutati.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/apk-signature.txt

          # apksigner labels the certificate as "V2 Signer: ...", not
          # "Signer #1", so match the suffix rather than a fixed prefix.
          DN="$(sed -n 's/^.*certificate DN: //p' build/apk-signature.txt | head -n 1)"
          APK_FP="$(sed -n 's/^.*certificate SHA-256 digest: //p' build/apk-signature.txt | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          EXPECTED_FP="$(keytool -list -v \
            -keystore android/app/khutati-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 \
            | tr -d ':' | tr 'A-F' 'a-f')"

          if [ -z "$APK_FP" ] || [ "$APK_FP" != "$EXPECTED_FP" ]; then
            echo "::error::APK certificate does not match the release keystore secret."
            exit 1
          fi
          if printf '%s' "$DN" | grep -qi 'CN=Android Debug'; then
            echo "::error::Refusing to publish a debug-signed APK."
            exit 1
          fi

          {
            echo "### Release signature"
            echo ""
            echo "- Subject: \`$DN\`"
            echo "- Certificate SHA-256: \`$APK_FP\`"
            echo "- Verified by: $(basename "$APKSIGNER")"
          } >> "$GITHUB_STEP_SUMMARY"

      # The shipped APK must stay small enough for a normal app. R8, obfuscation
      # and single-ABI builds keep it near 20 MiB; this guard stops a dependency
      # or an asset regression from silently publishing a huge download.
      - name: Report and guard release APK size
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/Khutati.apk
          BYTES=$(stat -c%s "$APK")
          MIB=$((BYTES / 1024 / 1024))
          MAX_BYTES=$((40 * 1024 * 1024))
          {
            echo "### Release APK (arm64)"
            echo ""
            echo "$MIB MiB ($BYTES bytes), ceiling $((MAX_BYTES / 1024 / 1024)) MiB"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Release APK: $MIB MiB ($BYTES bytes)"
          if [ "$BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::Release APK grew past $((MAX_BYTES / 1024 / 1024)) MiB; do not publish it."
            exit 1
          fi

      - name: Write the update manifest
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        run: |
          set -euo pipefail
          VERSION_LINE="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Khutati.apk"
          PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg notes "$(git log -1 --pretty=%s)" \
            --arg apkUrl "$APK_URL" \
            --arg pageUrl "$PAGE_URL" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionName:$versionName,versionCode:$versionCode,notes:$notes,apkUrl:$apkUrl,pageUrl:$pageUrl,publishedAt:$publishedAt}' \
            > build/app/outputs/flutter-apk/update.json
          cat build/app/outputs/flutter-apk/update.json

      - name: Verify the release APK exists
        run: |
          set -euo pipefail
          ls -l build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/Khutati.apk \
            || { echo "missing Khutati.apk"; exit 1; }

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: khutati-release-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/Khutati.apk
            build/app/outputs/flutter-apk/update.json
            build/apk-signature.txt
            build/symbols
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes publish the versioned release; main publishes a rolling
          # pre-release that always points at the newest build.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/Khutati.apk
            build/app/outputs/flutter-apk/update.json

