name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  verify:
    name: Verify (tokens, dataset, analyze, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install SQLite for database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Design tokens are in sync with the HTML prototype
        run: node tools/extract_tokens.mjs --check

      - name: Plan dataset reconciles to the PDF
        run: node tools/validate_plan_data.mjs

      - name: Validator still catches corruption
        run: node tools/validate_plan_data.mjs --self-test

      - name: Analyze
        # Warnings and infos are reported but do not block the build yet; errors do.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  build-debug:
    name: Build debug APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khutati-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  build-release:
    name: Build signed release APKs
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No keystore secret configured; the release APKs will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/khutati-release.jks
          {
            echo "storeFile=khutati-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties

      - name: Build release APKs split per ABI
        # One APK per architecture keeps the download small: arm64-v8a is the
        # only one most phones need, armeabi-v7a covers older devices.
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols

      - name: Verify the ABI splits exist
        run: |
          set -euo pipefail
          ls -l build/app/outputs/flutter-apk/
          for abi in arm64-v8a armeabi-v7a; do
            test -f "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              || { echo "missing app-${abi}-release.apk"; exit 1; }
          done

      - name: Upload release APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khutati-release-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/symbols
          retention-days: 30
          if-no-files-found: error

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes publish the versioned release; main publishes a rolling
          # pre-release that always points at the newest build.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

