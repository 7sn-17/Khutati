name: khutati
description: "خطتي — an Arabic-first, offline-first study plan app for the 68-day Professor MedX plan."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Data
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Typography & formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Platform services (Phase 4-5)
  flutter_local_notifications: ^18.0.1
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true

  assets:
    # Plan template. The only source of plan content in the app (PRD section 3.1).
    - khutati_plan_data.json
    # Bundled Google Fonts so the first launch renders Arabic offline.
    # google_fonts resolves these files before attempting any network fetch.
    - assets/google_fonts/
