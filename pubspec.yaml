name: khutati
description: "خطتي — an Arabic-first, offline-first study plan app for the 68-day Professor MedX plan."
publish_to: "none"
version: 0.2.3+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Data
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Motion
  flutter_animate: ^4.5.2

  # Icons
  flutter_svg: ^2.0.17

  # Typography & formatting
  intl: ^0.19.0

  # Platform services (Phase 4-5)
  flutter_local_notifications: ^18.0.1
  supabase_flutter: ^2.8.0

  # In-app updates (Supabase manifest with GitHub Releases fallback)
  http: ^1.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true
  # Enables ARB generation (l10n.yaml)
  generate: true

  assets:
    # Plan template. The only source of plan content in the app (PRD section 3.1).
    - khutati_plan_data.json
    # Official launcher icon, shown in the About modal.
    - assets/app_icon.png

  # Declared fonts are registered before the first frame, so the Arabic faces
  # never fall back to the platform default (and never touch the network).
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: google_fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: google_fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
    - family: Reem Kufi
      fonts:
        - asset: google_fonts/ReemKufi-Medium.ttf
          weight: 500
        - asset: google_fonts/ReemKufi-Bold.ttf
          weight: 700
